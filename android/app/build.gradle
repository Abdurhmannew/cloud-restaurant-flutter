plugins {
    id "com.android.application"               // Android application plugin
    id "com.google.gms.google-services"        // Firebase/Google Services integration
    id "kotlin-android"                        // Kotlin support for Android
    id "dev.flutter.flutter-gradle-plugin"     // Flutter Gradle plugin for integrating Flutter
}

android {
    namespace "com.example.cloudy_restaurant_APP"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.example.cloudy_restaurant_APP"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
      jvmTarget = "17"    }
}


flutter {
    source = "../.."
}
